<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cell{padding:22px 26px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--fw-cream);display:flex;align-items:center;gap:20px}
.cell.dark{background:var(--fw-navy);border-color:var(--fw-navy)}
img.full{height:34px}img.mono{height:46px}</style></head>
<body>
<div class="cell"><img class="full" src="../assets/firmaway-logo.png" alt="Firmaway"></div>
<div class="cell dark"><img class="full" src="../assets/firmaway-logo-light.png" alt="Firmaway"></div>
<div class="cell"><img class="mono" src="../assets/firmaway-monogram.png" alt="Fw"></div>
<div class="cell dark"><img class="mono" src="../assets/firmaway-monogram-light.png" alt="Fw"></div>
</body></html>
