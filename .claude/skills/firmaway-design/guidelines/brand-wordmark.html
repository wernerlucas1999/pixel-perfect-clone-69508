<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark & monogram" subtitle="Tri-tone tab + coral period" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);padding:20px 24px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.wm{display:inline-flex;align-items:center;gap:.34em;font-weight:800;letter-spacing:-.02em;line-height:1;font-size:38px}
.tab{display:inline-block;width:.16em;height:1.05em;border-radius:1px;background:linear-gradient(180deg,var(--fw-coral) 0 38%,var(--fw-navy) 38% 100%)}
.dot{color:var(--fw-coral)}.name{color:var(--fw-navy)}.on-dark{background:var(--fw-navy);padding:10px 18px;border-radius:var(--r-md)}.on-dark .name{color:var(--fw-cream)}
.mono{font-size:26px}</style></head>
<body>
<span class="wm"><span class="tab"></span><span class="name">Firmaway</span><span class="dot">.</span></span>
<span class="on-dark"><span class="wm"><span class="tab"></span><span class="name">Firmaway</span><span class="dot">.</span></span></span>
<span class="wm mono"><span class="tab"></span><span class="name">Fw</span><span class="dot">.</span></span>
</body></html>
