<!-- @dsCard group="Colors" viewport="700x160" name="Contrast pairings" subtitle="Mid-toned palette — pairings matter" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{border-radius:var(--r-md);padding:14px 16px;font-weight:800;font-size:15px}
.r{display:block;font-weight:600;font-size:11px;letter-spacing:.04em;margin-top:6px;opacity:.85}</style></head>
<body>
<div class="p" style="background:var(--fw-cream);color:var(--fw-navy);border:1px solid var(--border)">Navy on Cream<span class="r">11.0 : 1 · AAA · body & small</span></div>
<div class="p" style="background:var(--fw-navy);color:var(--fw-white)">White on Navy<span class="r">12.3 : 1 · AAA · dark dividers</span></div>
<div class="p" style="background:var(--fw-coral);color:var(--fw-white)">White on Coral<span class="r">3.4 : 1 · large only ≥24px bold</span></div>
<div class="p" style="background:var(--fw-cream);color:var(--fw-coral);border:1px solid var(--border)">Coral on Cream<span class="r">3.0 : 1 · large only · never body</span></div>
</body></html>
