<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="Coral leads · navy anchors · cream is the ground" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);padding:16px;display:flex;gap:12px}
.sw{flex:1;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.chip{height:64px}.m{padding:8px 10px}.n{font-weight:800;font-size:12px;color:var(--text)}
.h{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:2px}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--fw-coral)"></div><div class="m"><div class="n">Coral</div><div class="h">#F15A2F</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-navy)"></div><div class="m"><div class="n">Navy</div><div class="h">#31353E</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-cream);border-bottom:1px solid var(--border)"></div><div class="m"><div class="n">Cream</div><div class="h">#FEF1E0</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-white);border-bottom:1px solid var(--border)"></div><div class="m"><div class="n">White</div><div class="h">#FFFFFF</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-ink)"></div><div class="m"><div class="n">Ink</div><div class="h">#111317</div></div></div>
</body></html>
