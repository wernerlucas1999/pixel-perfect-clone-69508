<!-- @dsCard group="Colors" viewport="700x150" name="Derived · UI states" subtitle="Tints, shades & surfaces for build use" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);padding:16px;display:flex;gap:10px}
.sw{flex:1;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.chip{height:52px}.m{padding:6px 8px}.n{font-weight:800;font-size:11px;color:var(--text)}
.h{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:1px}</style></head>
<body>
<div class="sw"><div class="chip" style="background:var(--fw-coral-700)"></div><div class="m"><div class="n">Coral 700</div><div class="h">#C8481F</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-coral-300)"></div><div class="m"><div class="n">Coral 300</div><div class="h">#F79C7E</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-coral-100)"></div><div class="m"><div class="n">Coral 100</div><div class="h">#FBE0D4</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-navy-700)"></div><div class="m"><div class="n">Navy 700</div><div class="h">#21242B</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-navy-muted)"></div><div class="m"><div class="n">Navy Muted</div><div class="h">#5B616D</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-cream-200)"></div><div class="m"><div class="n">Cream 200</div><div class="h">#F7E5D0</div></div></div>
<div class="sw"><div class="chip" style="background:var(--fw-border)"></div><div class="m"><div class="n">Border</div><div class="h">#E4D3BE</div></div></div>
</body></html>
