<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8-point rhythm (4 for fine tuning)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);color:var(--text);padding:18px 24px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;font-size:12px}
.tok{width:64px;font-family:var(--font-mono);color:var(--text-muted)}
.bar{height:16px;background:var(--fw-coral);border-radius:2px}</style></head>
<body>
<div class="row"><span class="tok">4 · s-1</span><span class="bar" style="width:4px"></span></div>
<div class="row"><span class="tok">8 · s-2</span><span class="bar" style="width:8px"></span></div>
<div class="row"><span class="tok">12 · s-3</span><span class="bar" style="width:12px"></span></div>
<div class="row"><span class="tok">16 · s-4</span><span class="bar" style="width:16px"></span></div>
<div class="row"><span class="tok">24 · s-5</span><span class="bar" style="width:24px"></span></div>
<div class="row"><span class="tok">32 · s-6</span><span class="bar" style="width:32px"></span></div>
<div class="row"><span class="tok">48 · s-7</span><span class="bar" style="width:48px"></span></div>
<div class="row"><span class="tok">64 · s-8</span><span class="bar" style="width:64px"></span></div>
<div class="row"><span class="tok">96 · s-9</span><span class="bar" style="width:96px"></span></div>
</body></html>
