<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="One family, four voices" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);color:var(--text);padding:20px 24px}
.row{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border:none}.lab{font-size:11px;font-weight:700;color:var(--text-muted)}
.h1{font-weight:800;font-size:36px;letter-spacing:-.02em}.h2{font-weight:800;font-size:24px;letter-spacing:-.01em}
.sub{font-weight:800;font-size:19px;color:var(--fw-coral)}.acc{font-style:italic;font-weight:600;font-size:20px;color:var(--fw-coral)}
.body{font-weight:400;font-size:16px;line-height:1.5}.cap{font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--text-muted)}</style></head>
<body>
<div class="row"><div class="lab">H1 · title</div><div class="h1">El espacio del CEO</div></div>
<div class="row"><div class="lab">H2 · section</div><div class="h2">Novedades del mes</div></div>
<div class="row"><div class="lab">Subhead</div><div class="sub">Lo que lanzamos</div></div>
<div class="row"><div class="lab">Accent · italic</div><div class="acc">Más libres y simples.</div></div>
<div class="row"><div class="lab">Body</div><div class="body">Cobrá, vendé e invertí en el exterior.</div></div>
<div class="row"><div class="lab">Caption</div><div class="cap">07 — Mayo · Ezequiel</div></div>
</body></html>
