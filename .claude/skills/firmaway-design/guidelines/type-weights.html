<!-- @dsCard group="Type" viewport="700x150" name="Weights & emphasis" subtitle="Weight does the work — emphasis is bold, never color" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--fw-font);background:var(--bg);color:var(--text);padding:20px 24px}
.ws{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline}
.w{font-size:26px}.w span{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);font-weight:400;margin-top:2px}
.note{margin-top:16px;font-size:15px;line-height:1.5;color:var(--text)}</style></head>
<body>
<div class="ws">
<div class="w" style="font-weight:400">Aa<span>400 regular</span></div>
<div class="w" style="font-weight:600">Aa<span>600 semibold</span></div>
<div class="w" style="font-weight:700">Aa<span>700 bold</span></div>
<div class="w" style="font-weight:800">Aa<span>800 heavy</span></div>
<div class="w" style="font-weight:900">Aa<span>900 black</span></div>
</div>
<div class="note">Highlight the <b style="font-weight:700">key words</b> with weight, so body copy stays readable.</div>
</body></html>
